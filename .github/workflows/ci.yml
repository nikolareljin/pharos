name: CI

# Pharos is a public repository, so it runs full CI rather than the
# tagging-only workflow set used for private repositories.
#
# Pull requests are covered by pr-gate.yml; running both on a pull request would
# double every job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    uses: nikolareljin/ci-helpers/.github/workflows/kotlin.yml@production
    with:
      java_version: "17"
      lint_command: "./gradlew lintDebug"
      test_command: "./gradlew testDebugUnitTest"
      build_command: "./gradlew assembleDebug"
      timeout_minutes: 30

  # The checks the Gradle build knows nothing about. The shared checkout does
  # not fetch submodules, so anything needing script-helpers initializes it
  # first.
  checks:
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      concurrency_key: shell-checks
      lint_command: >-
        git submodule update --init --recursive &&
        bash scripts/check-private-names.sh &&
        shellcheck -S warning scripts/preflight.sh scripts/check-private-names.sh scripts/gen_icons.sh scripts/project.sh
      timeout_minutes: 15

name: PR Gate

# What every pull request must pass.
#
# check_release_tag makes a release/X.Y.Z pull request fail early if its tag
# already exists, rather than at tag time when the merge has already happened.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    uses: nikolareljin/ci-helpers/.github/workflows/pr-gate.yml@production
    with:
      check_release_tag: true
      concurrency_key: shell-checks
      lint_command: >-
        git submodule update --init --recursive &&
        bash scripts/check-private-names.sh &&
        bash scripts/check-changelog.sh &&
        shellcheck -S warning scripts/preflight.sh scripts/check-private-names.sh scripts/check-changelog.sh scripts/gen_icons.sh scripts/project.sh
      timeout_minutes: 15

  android:
    uses: nikolareljin/ci-helpers/.github/workflows/kotlin.yml@production
    with:
      java_version: "17"
      lint_command: "./gradlew lintDebug"
      test_command: "./gradlew testDebugUnitTest"
      build_command: "./gradlew assembleDebug"
      timeout_minutes: 30
